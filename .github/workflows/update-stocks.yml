name: Update Stock Master

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1-5"

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update NSE stocks
        run: python update_stocks.py
        - name: Test BSE data connection
        run: python test_bse.py

      - name: Save updated stock list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stocks.json
          git diff --cached --quiet || git commit -m "Update NSE stock master"
          git push
